name: Build

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  platformio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO and esptool
        run: pip install platformio esptool

      - name: Build ESP32-C3 firmware
        run: pio run

      - name: Create merged firmware
        run: |
          esptool merge-bin \
            -o .pio/build/esp32-c3-devkitm-1/firmware.merged.bin \
            0x0 .pio/build/esp32-c3-devkitm-1/bootloader.bin \
            0x8000 .pio/build/esp32-c3-devkitm-1/partitions.bin \
            0xe000 .pio/build/esp32-c3-devkitm-1/boot_app0.bin \
            0x10000 .pio/build/esp32-c3-devkitm-1/firmware.bin

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: COB-PWM-Controller-firmware
          path: |
            .pio/build/esp32-c3-devkitm-1/firmware.bin
            .pio/build/esp32-c3-devkitm-1/firmware.merged.bin
            .pio/build/esp32-c3-devkitm-1/bootloader.bin
            .pio/build/esp32-c3-devkitm-1/partitions.bin
          if-no-files-found: error
